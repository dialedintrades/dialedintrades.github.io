<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
  {% if site.analytics.plausible_domain and site.analytics.plausible_domain != "" %}
  <script defer data-domain="{{ site.analytics.plausible_domain }}" src="https://plausible.io/js/script.js"></script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/services/' | relative_url }}">Services</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
        <a class="btn btn-primary" href="{{ site.booking_url }}">Book a Discovery Call</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>
        <strong>{{ site.title }}</strong>
        <p>{{ site.tagline }}</p>
      </div>
      <div>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/services/' | relative_url }}">Services</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </div>
      <div>
        <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a>
      </div>
    </div>
  </footer>
</body>
</html>
